<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#1A202C" />
  <title>Resume | Sanabhi Gauraw</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      background: #1A202C;
      color: #E2E8F0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', 'Liberation Sans', sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', 'Noto Color Emoji';
      animation: page-arrive 0.35s ease-out both;
    }

    body.page-leaving {
      animation: none;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.18s ease, transform 0.18s ease;
    }

    @keyframes page-arrive {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    header {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    a {
      color: #4FD1C5;
      text-decoration: none;
    }

    a:hover,
    a:focus-visible {
      color: #F6AD55;
    }

    .resume-viewer {
      width: 100%;
      max-width: 1100px;
      flex: 1;
      min-height: 70vh;
      margin: 0 auto;
      border: 1px solid #2D3748;
      border-radius: 6px;
      background: #2D3748;
    }

    .resume-viewer iframe {
      display: block;
      width: 100%;
      height: calc(100vh - 7rem);
      min-height: 70vh;
      border: 0;
    }

    @media (max-width: 600px) {
      body {
        padding: 0.75rem;
      }

      header {
        align-items: flex-start;
        flex-direction: column;
      }

      .resume-viewer iframe {
        height: calc(100vh - 8rem);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      body {
        animation: none;
      }
      body.page-leaving {
        transition: none;
      }
    }
  </style>
  <link rel="stylesheet" href="../../css/site-theme.css" />
</head>

<body>
  <header>
    <a href="/">← Back to home</a>
    <a href="/assets/resume.pdf" target="_blank" rel="noopener noreferrer">Open PDF in new tab</a>
  </header>
  <main class="resume-viewer">
    <iframe src="/assets/resume.pdf" title="Sanabhi Gauraw resume">
      <p>Your browser can't display the embedded PDF. <a href="/assets/resume.pdf">Download the resume PDF</a>.</p>
    </iframe>
  </main>
  <script>
    document.addEventListener('click', (event) => {
      const link = event.target.closest('a[href]');
      if (!link || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey || link.target || link.hasAttribute('download')) return;
      const destination = new URL(link.href, window.location.href);
      if (destination.origin !== window.location.origin || destination.pathname === window.location.pathname) return;
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      event.preventDefault();
      document.body.classList.add('page-leaving');
      window.setTimeout(() => window.location.assign(destination.href), 180);
    });
  </script>
</body>
</html>
